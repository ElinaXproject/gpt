name: AUTORED IDEA RSS source smoke test

on:
  push:
    branches: [main]
    paths:
      - "config/research_feeds.json"
      - "scripts/test_rss_feeds.py"
      - "scripts/research_digest.py"
      - "config/research_queries.json"
      - ".github/workflows/rss-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rss-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify RSS feeds and source domains
        run: python scripts/test_rss_feeds.py
      - name: Build source-matched research digest
        run: python scripts/research_digest.py --output artifacts/research-digest.json
      - name: Upload research digest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autored-research-digest-smoke
          path: artifacts/research-digest.json
          retention-days: 3
