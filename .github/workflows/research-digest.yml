name: AUTORED IDEA daily research digest

on:
  schedule:
    - cron: "15 7,8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    name: Fetch and validate 72-hour source candidates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build research digest
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python scripts/research_digest.py --require-local-hour 9 --output artifacts/research-digest.json
          else
            python scripts/research_digest.py --output artifacts/research-digest.json
          fi
      - name: Upload research report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autored-research-digest
          path: artifacts/research-digest.json
          retention-days: 3
