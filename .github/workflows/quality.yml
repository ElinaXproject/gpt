name: Workbench quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-regression:
    name: Documentation and safety regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install AUTORED security dependency
        run: python -m pip install -r requirements-autored.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check Cloudflare Worker module syntax
        run: node --input-type=module --check < cloudflare/worker.js
      - name: Run Worker schedule and health tests
        run: node --test tests/worker.test.mjs
      - name: Verify deployed Cloudflare Worker health
        run: curl --fail --silent --show-error https://autored-idea-api.frozone-social.workers.dev/health

      - name: Verify deployed read-only ideas endpoint
        run: |
          invalid_status="$(curl --silent --show-error -o /tmp/ideas-invalid.json -w "%{http_code}" "https://autored-idea-api.frozone-social.workers.dev/ideas?date=2026-13-40")"
          test "$invalid_status" = "400"
          python -c "import json; d=json.load(open('/tmp/ideas-invalid.json')); assert d.get('error') == 'invalid_date'"
          local_date="$(TZ=Europe/Warsaw date +%F)"
          ideas_status="$(curl --silent --show-error -o /tmp/ideas-today.json -w "%{http_code}" "https://autored-idea-api.frozone-social.workers.dev/ideas?date=$local_date")"
          test "$ideas_status" = "200" -o "$ideas_status" = "404"
          python -c "import json; d=json.load(open('/tmp/ideas-today.json')); assert isinstance(d.get('items'), list)"
